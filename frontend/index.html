<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1B1325" />
    <meta name="description" content="SplitMate — share expenses, settle up, stay friends." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500;600&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block" rel="stylesheet" />
    <title>SplitMate</title>
  </head>
  <body>
    <script>
      (function() {
        // Night Market is the default. Only an explicit "light" preference
        // switches to the Daylight variant.
        var t = localStorage.getItem('splitmate-theme');
        if (t === 'light') {
          document.documentElement.classList.add('light');
        } else {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <div id="root" style="overflow-x: hidden; width: 100%;"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
